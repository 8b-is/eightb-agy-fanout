[package]
name = "eightb-agy-fanout"
version = "0.3.0"
edition = "2021"
description = "Zero-alloc LAN fan-out DAG scheduler, Ollama Wave Router, Apple Silicon MLX-quant bridge, and RustyNanoKVM HID engine for Antigravity CLI"
license = "MIT"
repository = "https://codeberg.org/8b-is/eightb-agy-fanout"
homepage = "https://github.com/8b-is/eightb-agy-fanout"

[lib]
name = "eightb_agy_fanout"
path = "src/lib.rs"

[[bin]]
name = "8b-agy"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
